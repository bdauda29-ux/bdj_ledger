{% extends "base.html" %}

{% block title %}Add User - Ledger System{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add New User</h2>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="POST" class="form">
        <!-- Account Info -->
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>

        <!-- Personal Info -->
        <div class="form-group">
            <label for="surname">Surname</label>
            <input type="text" name="surname" id="surname" placeholder="e.g. Doe">
        </div>

        <div class="form-group">
            <label for="passport_number">Passport Number</label>
            <input type="text" name="passport_number" id="passport_number" placeholder="A12345678">
        </div>

        <div class="form-group">
            <label for="passport_expiry">Passport Expiry Date</label>
            <input type="date" name="passport_expiry" id="passport_expiry">
        </div>

        <div class="form-group">
            <label for="nationality">Nationality</label>
            <select name="nationality" id="nationality">
                <option value="" disabled selected>Select nationality</option>
                <option value="NG">Nigeria</option>
                <option value="US">United States</option>
                <option value="UK">United Kingdom</option>
                <option value="CA">Canada</option>
                <option value="GH">Ghana</option>
                <option value="ZA">South Africa</option>
                <option value="KE">Kenya</option>
                <option value="AE">UAE</option>
                <option value="CN">China</option>
                <option value="IN">India</option>
            </select>
        </div>

        <!-- Roles & Permissions -->
        <div class="form-group" style="margin-top: 2rem;">
            <label class="checkbox-label" style="font-weight: 600; color: var(--text-primary);">
                <input type="checkbox" name="is_admin"> 
                Make this user an Admin
            </label>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; margin-left: 2rem;">Admins have full access to all settings and user management.</p>
        </div>

        <div class="form-group">
            <label style="margin-bottom: 10px; display: block;">Permissions</label>
            <div class="permissions-grid">
                <label class="checkbox-label">
                    <input type="checkbox" name="can_view_clients" checked> View Clients
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="can_edit_client" checked> Edit Client
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="can_delete_client" checked> Delete Client
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="can_add_transaction" checked> Add Transaction
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="can_edit_transaction" checked> Edit Transaction
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="can_delete_transaction" checked> Delete Transaction
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create User</button>
            <a class="btn btn-secondary" href="{{ url_for('list_users') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
