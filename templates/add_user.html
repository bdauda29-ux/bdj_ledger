{% extends "base.html" %}

{% block title %}Add User - Ledger System{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add User</h2>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="POST" class="form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_admin" style="width: auto; margin: 0;"> 
                <strong>Is Admin</strong>
            </label>
        </div>
        <div class="form-group">
            <label style="margin-bottom: 10px; display: block;">Permissions</label>
            <div class="permissions-grid">
                <label class="checkbox-label" style="gap: 8px;">
                    <input type="checkbox" name="can_view_clients" checked style="width: auto; margin: 0;"> View Clients
                </label>
                <label class="checkbox-label" style="gap: 8px;">
                    <input type="checkbox" name="can_edit_client" checked style="width: auto; margin: 0;"> Edit Client
                </label>
                <label class="checkbox-label" style="gap: 8px;">
                    <input type="checkbox" name="can_delete_client" checked style="width: auto; margin: 0;"> Delete Client
                </label>
                <label class="checkbox-label" style="gap: 8px;">
                    <input type="checkbox" name="can_add_transaction" checked style="width: auto; margin: 0;"> Add Transaction
                </label>
                <label class="checkbox-label" style="gap: 8px;">
                    <input type="checkbox" name="can_edit_transaction" checked style="width: auto; margin: 0;"> Edit Transaction
                </label>
                <label class="checkbox-label" style="gap: 8px;">
                    <input type="checkbox" name="can_delete_transaction" checked style="width: auto; margin: 0;"> Delete Transaction
                </label>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create</button>
            <a class="btn btn-secondary" href="{{ url_for('list_users') }}">Cancel</a>
        </div>
    </form>
{% endblock %}
