{% extends "base.html" %}

{% block title %}Edit Asset - Ledger System{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Asset / Debt</h2>
    
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    
    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" name="name" id="name" value="{{ asset.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" rows="3">{{ asset.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label>Type</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="type" value="asset" {% if asset.type == 'asset' %}checked{% endif %}>
                    <span>Asset</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="type" value="debt" {% if asset.type == 'debt' %}checked{% endif %}>
                    <span>Debt</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Currency</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="currency" value="Naira" {% if asset.currency == 'Naira' %}checked{% endif %}>
                    <span>Naira (₦)</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="currency" value="Dollar" {% if asset.currency == 'Dollar' %}checked{% endif %}>
                    <span>Dollar ($)</span>
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="amount">Amount *</label>
            <input type="number" name="amount" id="amount" value="{{ asset.amount }}" step="0.01" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{{ url_for('assets') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<style>
    .radio-group {
        display: flex;
        gap: 1rem;
        margin-top: 0.5rem;
    }
    .radio-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
    }
</style>
{% endblock %}
