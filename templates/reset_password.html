<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1">
<style>
  /* Page-specific overrides */
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-body);
    font-family: var(--font-family);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  .app-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%);
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    padding: 2.5rem;
    box-shadow: var(--card-shadow);
    animation: fadeIn 0.6s ease-out;
  }

  .logo-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  
  .logo-text {
    font-size: 1.75rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary-color), var(--accent-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.025em;
  }
  
  .welcome-text {
    margin-top: 0.5rem;
    color: var(--text-secondary);
    font-size: 0.95rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }
  
  label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
  }
  
  .form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  
  .form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px var(--primary-light);
    background: rgba(15, 23, 42, 0.8);
  }
  
  .btn-login {
    width: 100%;
    padding: 0.875rem;
    background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3);
  }
  
  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 8px -1px rgba(99, 102, 241, 0.4);
  }
  
  .footer-row {
    margin-top: 2rem;
    text-align: center;
    font-size: 0.875rem;
    color: var(--text-secondary);
  }
  
  .footer-row a {
    color: var(--primary-color);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }
  
  .footer-row a:hover {
    color: var(--primary-hover);
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="login-card">
    <div class="logo-header">
      <div class="logo-text">Finux</div>
      <div class="welcome-text">Set your new password</div>
    </div>

    {% if error %}
    <div class="alert alert-error" style="margin-bottom: 1.5rem;">{{ error }}</div>
    {% endif %}
    
    <form method="post">
      <div class="form-group">
          <label>New Password</label>
          <input type="password" name="new_password" class="form-control" required autofocus placeholder="Enter new password">
      </div>
      
      <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required placeholder="Confirm new password">
      </div>
      
      <div class="form-group">
        <button class="btn-login" type="submit">Reset Password</button>
      </div>

      <div class="footer-row">
        <a href="{{ url_for('login') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
