{% extends "base.html" %}

{% block title %}Wallet - Ledger System{% endblock %}

{% block content %}
<div class="page-actions-bar">
    <h2 style="margin: 0; font-size: 1.5rem; color: var(--text-primary);">Wallet Management</h2>
</div>

<div class="form-container">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="dollars">GTB $</label>
            <input type="number" step="0.01" id="dollars" name="dollars" class="form-control" value="{{ wallet.dollars if wallet else 0 }}" required>
        </div>

        <div class="form-group">
            <label for="providus_dollars">Providus $</label>
            <input type="number" step="0.01" id="providus_dollars" name="providus_dollars" class="form-control" value="{{ wallet.providus_dollars if wallet else 0 }}">
        </div>

        <div class="form-group">
            <label for="naira">GTB N</label>
            <input type="number" step="0.01" id="naira" name="naira" class="form-control" value="{{ wallet.naira if wallet else 0 }}" required>
        </div>

        <div class="form-group">
            <label for="naira_1">Access N</label>
            <input type="number" step="0.01" id="naira_1" name="naira_1" class="form-control" value="{{ wallet.naira_1 if wallet else 0 }}">
        </div>

        <div class="form-group">
            <label for="taj_naira">Taj N</label>
            <input type="number" step="0.01" id="taj_naira" name="taj_naira" class="form-control" value="{{ wallet.taj_naira if wallet else 0 }}">
        </div>

        <div class="form-group">
            <label for="debt">Debt</label>
            <input type="number" step="0.01" id="debt" name="debt" class="form-control" value="{{ wallet.debt if wallet else 0 }}">
        </div>

        <div class="form-group">
            <label for="rate">Rate</label>
            <input type="number" step="0.01" id="rate" name="rate" class="form-control" value="{{ wallet.rate if wallet else 0 }}" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Update Wallet</button>
        </div>
    </form>
</div>
{% endblock %}
