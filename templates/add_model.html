{% extends "base.html" %}

{% block title %}Create Model - Ledger System{% endblock %}

{% block content %}
<style>
    /* Jetstream-inspired Styling for Add Model Page */
    :root {
        --primary: #111827; /* Dark navy/black button */
        --primary-hover: #1f2937;
        --ring: #4f46e5; /* Indigo focus ring */
        --bg-body: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e5e7eb;
        --text-primary: #0f172a;
        --text-muted: #64748b;
    }
    
    .form-container h2 {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1.5rem;
    }
    
    /* Buttons */
    .btn {
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        transition: all 0.2s;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }
    
    .btn-primary {
        background-color: var(--primary);
        border-color: var(--primary);
        color: white;
    }
    
    .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
    }
    
    .btn-secondary {
        background-color: white;
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        margin-left: 1rem;
    }
    
    .btn-secondary:hover {
        background-color: #f3f4f6;
    }

    /* Form Elements */
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    label {
        display: block;
        font-size: 0.9rem;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-family: 'Inter', system-ui, sans-serif;
    }
    
    input[type="text"] {
        width: 100%;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 1rem;
        color: var(--text-primary);
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    
    input[type="text"]:focus {
        border-color: var(--ring);
        outline: none;
        box-shadow: 0 0 0 1px var(--ring);
    }
    
    /* Alerts */
    .alert {
        border-radius: 6px;
        font-size: 0.875rem;
        padding: 0.75rem 1rem;
        border: 1px solid transparent;
        margin-bottom: 1.5rem;
    }
    
    .alert-error {
        background-color: #fef2f2;
        color: #991b1b;
        border-color: #fecaca;
    }
</style>

<div class="form-container">
    <h2>Create New Model</h2>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Model Name</label>
            <input type="text" name="name" id="name" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="{{ url_for('models') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
