<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#475569;
  --primary:#111827; /* Dark navy/black button */
  --primary-hover:#1f2937;
  --ring:#4f46e5; /* Indigo focus ring */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,.06);padding:1.5rem}
h1{font-size:1.5rem;margin:0 0 1.5rem 0; text-align: center; font-weight: 600;}
label{display:block;font-size:.9rem;color:var(--text);margin:.75rem 0 .35rem; font-weight: 500;}
input{width:100%;padding:.7rem .8rem;border:1px solid var(--border);border-radius:6px;background:#fff;outline:none;transition:border-color .15s, box-shadow .15s; font-family: inherit; font-size: 1rem; color: var(--text);}
input:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.5rem;background:var(--primary);color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;transition:background-color .15s, transform .02s; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em;}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:translateY(1px)}
.link{color:var(--muted);text-decoration:underline; font-size: 0.9rem; cursor: pointer;}
.link:hover{color:var(--text)}
.alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 0.9rem; }
.alert-error { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
.alert-success { background-color: #def7ec; color: #03543f; border: 1px solid #84e1bc; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Forgot Password</h1>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if reset_url %}
    <div class="alert alert-success">
        Reset Link: <a href="{{ reset_url }}">{{ reset_url }}</a> (valid for 1 hour)
    </div>
    {% endif %}
    <form method="post">
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1.5rem;">
        Enter your username and we'll send you a link to reset your password.
      </p>
      
      <label>Username</label>
      <input type="text" name="username" required autofocus>
      
      <div class="footer-row">
        <a class="link" href="{{ url_for('login') }}">Back to Login</a>
        <button class="btn" type="submit">Email Link</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
