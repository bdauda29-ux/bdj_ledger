<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
        <h1>Forgot Password</h1>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if reset_url %}
    <div class="alert alert-success">
        Reset Link: <a href="{{ reset_url }}">{{ reset_url }}</a> (valid for 1 hour)
    </div>
    {% endif %}
    
    <form method="post">
      <p class="auth-description">
        Enter your username and we'll send you a link to reset your password.
      </p>
      
      <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
      </div>
      
      <div class="auth-footer-row">
        <a class="auth-link" href="{{ url_for('login') }}">Back to Login</a>
        <button class="btn btn-primary" type="submit">Email Link</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
