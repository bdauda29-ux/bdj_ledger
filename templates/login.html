<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo" class="auth-logo">
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required autofocus placeholder="Enter your username">
      </div>
      
      <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Enter your password">
      </div>
      
      <div class="auth-footer-row auth-footer-col">
        <button class="btn btn-primary btn-full-width" type="submit">Log in</button>
        <div class="auth-footer-link-wrapper">
            <a href="{{ url_for('forgot_password') }}" class="auth-link">Forgot Password?</a>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
